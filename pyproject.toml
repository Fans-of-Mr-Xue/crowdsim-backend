[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crowdsim-arde-backend"
version = "1.0.0"
description = "CrowdSim runtime with the ARDE emergency crowd-control engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9,<4.0",
  "httpx>=0.27,<1.0",
  "websockets>=10.0",
  "pymongo>=4.6,<5.0",
  "python-dotenv>=1.0,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["arde_emergency*", "crowdsim*", "postanalysis_api*", "data_service*"]

[tool.setuptools.package-data]
arde_emergency = ["README.md", "examples/*.json"]
