<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrowdSim · 三模型试运行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f7;color:#203448;font:15px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1380px;margin:auto;padding:32px}h1{font-size:32px;letter-spacing:-1px;margin:6px 0 10px}h2{font-size:18px;margin:0 0 12px}.eyebrow{font-size:12px;letter-spacing:2px;color:#537185}header p{max-width:850px;color:#65788a;margin:8px 0}.badge{display:inline-block;border:1px solid #c8ddd7;color:#24725c;background:#e8f2ed;padding:3px 9px;border-radius:7px;font-size:12px}.inputs{display:flex;gap:28px;flex-wrap:wrap;background:#fff;border:1px solid #dfe7ed;border-radius:12px;padding:17px 22px;margin:24px 0}.inputs span{color:#6e8190;font-size:12px}.inputs b{display:block;font-size:20px;color:#203448}.controls{display:flex;align-items:center;gap:20px;margin:22px 0;flex-wrap:wrap}.controls input[type=range]{flex:1;min-width:180px;accent-color:#39748d}.controls label{display:flex;gap:8px;align-items:center}button,select{font:inherit;border:1px solid #cdd9e1;background:#fff;color:#294559;border-radius:8px;padding:8px 14px;cursor:pointer}.models{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{background:white;border:1px solid #dfe7ed;border-radius:14px;padding:19px;min-width:0}.card h2{display:flex;align-items:center;gap:8px}.dot{height:9px;width:9px;border-radius:50%;display:inline-block}.card small{display:block;min-height:40px;color:#7a8b96;font-size:12px}.map{width:100%;display:block;background:#f5f7fa;border-radius:10px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;font-size:11px;color:#728797}.stats b{display:block;font-size:23px;font-weight:600;color:#2b4557}.legend{display:flex;align-items:center;gap:14px;font-size:12px;color:#6b7e8d;margin:16px 0}.gradient{width:120px;height:9px;background:linear-gradient(90deg,#eef4e9,#a9cd7e,#f4c274,#c6534e);border-radius:3px}.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;margin-top:24px}.chart{width:100%;height:auto}.chart text{font:12px system-ui;fill:#748897}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px 6px;border-bottom:1px solid #e7edf2;text-align:left}th{color:#80919d;font-weight:500}.note{color:#778a98;font-size:12px;margin:12px 0 0}.errors{background:#fff0ec;color:#a04835;padding:15px;border-radius:10px}details{margin-top:24px;color:#6a7e8f;font-size:13px}li{margin:8px 0}a{color:#39748d}summary{cursor:pointer}@media(max-width:950px){.models{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}.card small{min-height:0}main{padding:20px}.map{max-height:400px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<header><div class="eyebrow">CROWDSIM / 事前仿真原型</div><h1>同一场地，三种模型</h1><span class="badge">真实引擎计算 · 查看已计算结果</span><p id="intro"></p></header>
<div class="inputs" id="inputs"></div>
<div id="errors"></div><div class="controls"><button id="play">播放切片</button><b id="time"></b><input id="timeSlider" aria-label="时间切片" type="range" min="0" value="0" step="1"><label><input id="agents" type="checkbox" checked>显示模拟行人</label></div>
<div class="models" id="models"></div><div class="legend"><span>共同密度色标</span><div class="gradient"></div><span id="scale"></span><span>灰色区域不可行走 · 紫色点为驻留行人</span></div>
<div class="bottom"><section class="card"><h2>同一指标的三条曲线</h2><select id="metric" aria-label="对比指标"><option value="crowd">场内人数（人）</option><option value="max_density_p_m2">局部最大密度（人/㎡）</option><option value="departed">累计离场（人）</option><option value="outflow_p_min">切片间平均离场流量（人/分钟）</option><option value="outside_queue">场外排队（人）</option></select><svg class="chart" id="chart" viewBox="0 0 600 250" role="img" aria-label="三模型时间曲线"></svg><p class="note">只连接已保存的分钟切片；两点之间没有额外计算结果。</p></section><section class="card"><h2>当前切片</h2><table><thead><tr><th>方法</th><th>场内</th><th>场外</th><th>已离场</th></tr></thead><tbody id="table"></tbody></table><p class="note">守恒模型输出连续期望人数，逐人模型输出整数人数。单次种子结果不能用于判断模型精度高低。</p><p class="note">微观轨迹由 JuPedSim 1.4.2 计算。三者共用场地、来流、驻留与通道服务假设；出口以吸附网格作为吸收区。</p></section></div>
<details><summary>输入来源、模型依据与首版限制</summary><ul id="assumptions"></ul><div id="sources"></div></details>
</main><script type="application/json" id="result">__RESULT_JSON__</script><script type="module">
const data=JSON.parse(document.querySelector('#result').textContent), results=data.results;
const colors=['#39748d','#168568','#cf6c23'];
const duration=results[0].series.at(-1).minute;
const slider=document.querySelector('#timeSlider'), toggle=document.querySelector('#agents'), metric=document.querySelector('#metric');
slider.max=results[0].series.length-1;
const polygon=data.network.boundary.coordinates[0], xs=polygon.map(p=>p[0]),ys=polygon.map(p=>p[1]);
const left=Math.min(...xs),right=Math.max(...xs),bottom=Math.min(...ys),top=Math.max(...ys);
const cosLat=Math.cos((top+bottom)/2*Math.PI/180), mapScale=Math.min(324/((right-left)*cosLat),384/(top-bottom));
const pos=([x,y])=>[180+(x-(left+right)/2)*cosLat*mapScale,210-(y-(top+bottom)/2)*mapScale];
const path=geometry=>(geometry.type==='Polygon'?[geometry.coordinates]:geometry.coordinates).map(poly=>poly.map(ring=>ring.map((p,i)=>(i?'L':'M')+pos(p).join(',')).join(' ')+'Z').join(' ')).join(' ');
const maximum=Math.max(.01,...results.flatMap(r=>r.series.map(s=>s.max_density_p_m2)));
const densityColor=value=>`hsl(${110*(1-Math.min(1,value/maximum))} 52% ${95-42*Math.min(1,value/maximum)}%)`;
const number=(value,digits=0)=>Number(value||0).toFixed(digits);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#intro').textContent=data.task.region.name+'。拖动时间轴比较人数、密度与离场过程。路网沿用保存的场地资料；人数、来流和驻留为试运行假设，尚未现场标定。';
const inputs=[['场地',data.road_snapshot.source?.provider==='sumo'?'纪念塔既有路网':'虚构广场'],['初始人数',data.settings.initial_crowd+' 人'],['前两分钟来流',data.settings.arrival_rate_per_minute+' 人/分钟'],['平均驻留',data.settings.dwell_minutes+' 分钟'],['时间窗',duration+' 分钟'],['共同统计网格',data.network.grid_m+' 米']];
document.querySelector('#inputs').innerHTML=inputs.map(([label,value])=>'<div><span>'+escape(label)+'</span><b>'+escape(value)+'</b></div>').join('');
document.querySelector('#scale').textContent='0 — '+maximum.toFixed(3)+' 人/㎡（全时段共同上限）';
document.querySelector('#assumptions').innerHTML=data.assumptions.map(s=>'<li>'+escape(s)+'</li>').join('');
document.querySelector('#sources').innerHTML=results.map(r=>'<p><a target="_blank" rel="noreferrer" href="'+escape(r.method.source)+'">'+escape(r.method.name)+'</a> · '+escape(r.method.boundary)+'</p>').join('');
if(data.method_errors.length) document.querySelector('#errors').innerHTML='<p class="errors">'+data.method_errors.map(e=>escape(e.method.name+'：'+e.message)).join('<br>')+'</p>';
function draw(){
 const index=Number(slider.value),minute=results[0].series[index].minute;
 document.querySelector('#time').textContent='第 '+minute+' 分钟';
 document.querySelector('#models').innerHTML=results.map((r,ri)=>{const row=r.series[index];
  const cells=data.network.cells.map((c,i)=>`<path d="${path(c.geometry)}" fill="${densityColor(row.cells.density[i])}" fill-rule="evenodd" stroke="white" stroke-width=".6"/>`).join('');
  const gates=data.network.gates.map(g=>{const p=pos(g.center),closed=g.id==='C'&&(data.settings.emergency_open_minute<0||minute<data.settings.emergency_open_minute);return `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${closed?'#adb9c2':'#39748d'}"/><text x="${p[0]+7}" y="${p[1]-7}" font-size="12" fill="#284658">${g.id}${closed?' 关闭':''}</text>`}).join('');
  const agents=toggle.checked?(row.agents||[]).map(a=>{const p=pos(a.position);return `<circle cx="${p[0]}" cy="${p[1]}" r="1.65" fill="${a.phase==='staying'?'#803da3':'#19394a'}"/>`}).join(''):'';
  return `<section class="card"><h2><i class="dot" style="background:${colors[ri]}"></i>${escape(r.method.name)}</h2><small>${escape(r.method.engine)} · ${row.agents?'逐人位置汇总为网格密度':'分区连续期望人数，无个体轨迹'}</small><svg class="map" viewBox="0 0 360 420" role="img" aria-label="${escape(r.method.name)} 场地密度"><path d="${path(data.network.boundary)}" fill="#aeb9c1"/>${cells}${agents}${gates}</svg><div class="stats"><div>场内人数<b>${number(row.crowd,ri===0?1:0)}</b></div><div>最大密度<b>${number(row.max_density_p_m2,3)}</b></div><div>累计离场<b>${number(row.departed,ri===0?1:0)}</b></div></div></section>`;
 }).join('');
 document.querySelector('#table').innerHTML=results.map((r,i)=>{const s=r.series[index];return `<tr><td><i class="dot" style="background:${colors[i]}"></i> ${escape(r.method.name)}</td><td>${number(s.crowd,i===0?1:0)}</td><td>${number(s.outside_queue,i===0?1:0)}</td><td>${number(s.departed,i===0?1:0)}</td></tr>`}).join('');
 const ymax=Math.max(1,...results.flatMap(r=>r.series.map(s=>s[metric.value])))*1.1, x=m=>45+m/duration*535,y=v=>210-v/ymax*180;
 const ticks=Array.from({length:5},(_,i)=>{const v=ymax*i/4;return `<line x1="45" x2="580" y1="${y(v)}" y2="${y(v)}" stroke="#e0e7ed"/><text x="38" y="${y(v)+4}" text-anchor="end">${number(v,metric.value.includes('density')?2:0)}</text>`}).join('');
 const lines=results.map((r,i)=>`<polyline points="${r.series.map(s=>x(s.minute)+','+y(s[metric.value])).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="2.5"/>`).join('');
 document.querySelector('#chart').innerHTML=ticks+lines+`<line x1="${x(minute)}" x2="${x(minute)}" y1="25" y2="210" stroke="#8194a1" stroke-dasharray="3 4"/>`+results[0].series.map(row=>row.minute).map(m=>`<text x="${x(m)}" y="235" text-anchor="middle">${m} 分钟</text>`).join('');
}
let timer=null;const button=document.querySelector('#play');
function stop(){clearInterval(timer);timer=null;button.textContent='播放切片'}
button.onclick=()=>{if(timer)return stop();if(Number(slider.value)===Number(slider.max))slider.value=0;draw();button.textContent='暂停';timer=setInterval(()=>{slider.value=Number(slider.value)+1;draw();if(Number(slider.value)>=Number(slider.max))stop()},1200)};
slider.oninput=()=>{stop();draw()};toggle.onchange=draw;metric.onchange=draw;draw();
</script></body></html>
